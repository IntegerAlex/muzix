[project]
name = "muzix-backend"
version = "0.1.0"
description = "Muzix FastAPI backend: search + presigned R2 URLs"
requires-python = ">=3.10"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "boto3>=1.35.0",
    "python-dotenv>=1.0.0",
    "mutagen>=1.47.0",
    "argon2-cffi>=21.3.0",
    "bcrypt>=4.0.0",
    "PyJWT>=2.8.0",
    "aiohttp>=3.10.0",
    "orjson>=3.11.9",
    "implicit>=0.7.3",
    "scipy>=1.14.0",
]

[tool.setuptools]
py-modules = ["main", "db", "models"]

[tool.fastapi]
entrypoint = "main:app"
